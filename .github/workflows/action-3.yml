name: Third action of this repo 

on: 
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

jobs:
  python_enviroment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python my_script.py